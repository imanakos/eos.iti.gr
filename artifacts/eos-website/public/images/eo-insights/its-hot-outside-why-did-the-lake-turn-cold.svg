<svg width="560" height="260" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 260" role="img" aria-labelledby="upwellingtitle upwellingdesc"><title id="upwellingtitle">Warmer water moves away from the shore; colder water rises</title><desc id="upwellingdesc">Illustrative side view. An arrow in the warmer surface layer points away from the shore. A second arrow curves up through the colder water below, towards the shallow shore.</desc><rect x="0" y="0" width="560" height="260" rx="8" fill="#edf5f2" stroke="none" stroke-width="1.5"/><text x="18" y="32" fill="#173b40" font-family="system-ui, sans-serif" font-size="23" font-weight="bold" text-anchor="start">A summer lake, seen from the side</text><defs><clipPath id="upwelling-panel"><rect width="560" height="260" rx="8"/></clipPath></defs><g clip-path="url(#upwelling-panel)"><path d="M0 91H560V260H0Z" fill="#b6dbe3"/><path d="M194 91H560V155C446 157 331 144 264 119C235 109 211 97 194 91Z" fill="#f1d39c"/><path d="M194 91C211 97 235 109 264 119C331 144 446 157 560 155" fill="none" stroke="#92846c" stroke-width="1.8"/><path d="M0 65Q49 64 85 86C116 105 139 145 181 177C242 223 339 244 458 250L560 254V260H0Z" fill="#dfd9bf"/><path d="M0 65Q49 64 85 86C116 105 139 145 181 177C242 223 339 244 458 250L560 254" fill="none" stroke="#786e58" stroke-width="2.5"/><path d="M93 91H560" stroke="#477383" stroke-width="2.5"/></g><text x="16" y="108" fill="#504737" font-family="system-ui, sans-serif" font-size="21" font-weight="bold" text-anchor="start">Shore</text><text x="331" y="115" fill="#503816" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" text-anchor="start">Warmer surface water</text><path d="M349 131H513M504 124L514 131L504 138" fill="none" stroke="#77501f" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M309 181C243 179 183 155 147 106M147 121L145 104L161 109" fill="none" stroke="#215f76" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="289" y="211" fill="#164958" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" text-anchor="start">Colder water rises</text></svg>
