<svg width="624" height="174" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 624 174" role="img" aria-labelledby="diarytitle diarydesc"><title id="diarytitle">Two sightings and a reconstruction</title><desc id="diarydesc">Monday and Friday were observed. The reconstructed Wednesday is an estimate, not a third sighting.</desc><rect x="0" y="0" width="624" height="174" rx="8" fill="#f0f6f4" stroke="none" stroke-width="1.5"/><text x="20" y="32" fill="#173b40" font-family="system-ui, sans-serif" font-size="19" font-weight="bold" text-anchor="start">What goes in the lake diary?</text><rect x="14" y="52" width="192" height="88" rx="8" fill="#d5eae2" stroke="none" stroke-width="1.5"/><text x="110" y="85" fill="#173b40" font-family="system-ui, sans-serif" font-size="19" font-weight="bold" text-anchor="middle">Monday</text><text x="110" y="118" fill="#173b40" font-family="system-ui, sans-serif" font-size="17" font-weight="normal" text-anchor="middle">Seen</text><rect x="215" y="52" width="192" height="88" rx="8" fill="#fae8c6" stroke="none" stroke-width="1.5"/><text x="311" y="85" fill="#173b40" font-family="system-ui, sans-serif" font-size="19" font-weight="bold" text-anchor="middle">Wednesday</text><text x="311" y="118" fill="#173b40" font-family="system-ui, sans-serif" font-size="17" font-weight="normal" text-anchor="middle">Filled in by AI</text><rect x="416" y="52" width="192" height="88" rx="8" fill="#d5eae2" stroke="none" stroke-width="1.5"/><text x="512" y="85" fill="#173b40" font-family="system-ui, sans-serif" font-size="19" font-weight="bold" text-anchor="middle">Friday</text><text x="512" y="118" fill="#173b40" font-family="system-ui, sans-serif" font-size="17" font-weight="normal" text-anchor="middle">Seen</text></svg>
