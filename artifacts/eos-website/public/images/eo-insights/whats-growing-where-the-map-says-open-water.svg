<svg width="432" height="326" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 432 326" role="img" aria-labelledby="aquatic-growthtitle aquatic-growthdesc"><title id="aquatic-growthtitle">Reeds, floating leaves and plants beneath an open surface</title><desc id="aquatic-growthdesc">Conceptual side view, not a satellite image. On the left, reeds rise above the water. In the middle, lily-like leaves rest on the surface while stems reach down to roots. On the right, the surface is bare but plants grow below it. An overhead camera may see them in clear, shallow water; an undetected plant is not necessarily absent.</desc><rect x="0" y="0" width="432" height="326" rx="8" fill="#f0f6f4" stroke="none" stroke-width="1.5"/><defs><clipPath id="aquatic-shore-clip"><rect x="9" y="52" width="414" height="177" rx="8"/></clipPath><linearGradient id="aquatic-water" x2="0" y2="1" gradientUnits="objectBoundingBox"><stop offset="0" stop-color="#c9e7e6"/><stop offset="1" stop-color="#98cbd3"/></linearGradient></defs><text x="76" y="35" fill="#173b40" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">Reeds</text><text x="212" y="35" fill="#173b40" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Floating leaves</text><text x="357" y="35" fill="#173b40" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" text-anchor="middle">Open surface</text><g clip-path="url(#aquatic-shore-clip)"><rect x="9" y="52" width="414" height="177" fill="#e7f1eb"/><path d="M9 116H423V229H9Z" fill="url(#aquatic-water)"/><path d="M9 153Q45 160 91 172T197 196Q269 206 338 217Q384 221 423 216V229H9Z" fill="#dfd5b7"/><path d="M9 153Q45 160 91 172T197 196Q269 206 338 217Q384 221 423 216" fill="none" stroke="#80775d" stroke-width="1.7"/><path d="M9 116H423" stroke="#487b86" stroke-width="2"/><g fill="none" stroke="#426843" stroke-width="2.8" stroke-linecap="round"><path d="M55 165Q51 128 43 75M64 167Q61 117 65 63M66 167Q74 119 87 81M79 170Q84 141 95 104"/></g><g fill="#64834e"><path d="M58 151Q39 127 27 91Q46 112 58 151Z"/><path d="M63 143Q62 99 75 78Q72 116 63 143Z"/><path d="M72 150Q88 121 110 112Q90 128 72 150Z"/></g><g fill="#887042"><path d="M42 82Q35 77 34 69L40 72 36 62Q45 65 45 81Z"/><path d="M64 70Q58 64 58 56L62 59 61 51Q69 53 68 66Z"/><path d="M85 88Q83 80 89 72L89 77 96 68Q98 77 86 89Z"/></g><g fill="none" stroke="#547c5c" stroke-width="2.6" stroke-linecap="round"><path d="M204 198C202 177 185 152 184 116M207 198C222 173 244 157 238 116M207 198Q197 204 190 205M207 198Q214 202 223 202"/></g><g fill="#76a16a" stroke="#375f42" stroke-width="1.7" stroke-linejoin="round"><path d="M159 114C161 108 194 106 204 112C211 118 189 122 170 119L183 115Z"/><path d="M218 114C222 108 251 107 258 112C268 118 246 121 227 118L239 114Z"/></g><g fill="#60957a" stroke="#476e5d" stroke-width="1.25" stroke-linejoin="round"><path d="M330 215Q311 191 312 165Q321 181 321 190Q321 179 324 172Q325 193 330 215Z"/><path d="M331 215Q333 198 329 176Q325 160 336 147Q330 163 336 177Q343 195 331 215Z"/><path d="M332 215Q339 191 354 180Q366 172 367 158Q375 172 361 185Q344 199 332 215Z"/><path d="M354 219Q360 205 360 197Q356 184 362 181Q361 189 365 196Q367 205 354 219Z"/><path d="M355 219Q371 197 384 194Q375 204 370 209Z"/></g></g><text x="16" y="259" fill="#173b40" font-family="system-ui, sans-serif" font-size="22" font-weight="bold" text-anchor="start">A bare surface can hide plants.</text><text x="16" y="287" fill="#173b40" font-family="system-ui, sans-serif" font-size="20" font-weight="normal" text-anchor="start">In clear, shallow water a camera may</text><text x="16" y="312" fill="#173b40" font-family="system-ui, sans-serif" font-size="19" font-weight="normal" text-anchor="start">see leaves below. In murky water it may not.</text></svg>
