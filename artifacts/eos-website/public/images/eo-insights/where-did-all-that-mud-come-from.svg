<svg width="624" height="235" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 624 235" role="img" aria-labelledby="plumetitle plumedesc"><title id="plumetitle">A nearby field is not necessarily the source</title><desc id="plumedesc">A conceptual stream enters a lake beside a plume-like patch. Field A has a possible drainage connection. Field B is nearby, but no flow path from it is established. The diagram identifies no source.</desc><rect x="0" y="0" width="624" height="235" rx="8" fill="#f0f6f4" stroke="none" stroke-width="1.5"/><path d="M55,25 Q137,10 173,45 T295,61 Q336,67 354,120 L378,156" fill="none" stroke="#4094a9" stroke-width="11" stroke-linecap="round"/><path d="M0,204 Q97,142 172,178 T329,166 Q405,117 474,151 Q548,175 624,136 V235 H0Z" fill="#98cfd3"/><path d="M355,153 Q373,149 395,154 L446,176 Q416,181 385,173 Q364,171 341,164Z" fill="#c08e42" stroke="#8c632d" stroke-width="2"/><path d="M408,42 L476,25 499,72 434,86Z" fill="#cecf97" stroke="#7b814f" stroke-width="2"/><path d="M463,98 L532,84 545,127 469,134Z" fill="#dce3bc" stroke="#7b814f" stroke-width="2"/><path d="M430,61 Q377,79 349,113" fill="none" stroke="#486c50" stroke-width="3.5" stroke-dasharray="6 5"/><text x="28" y="82" fill="#173b40" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="start">Water flowing</text><text x="28" y="102" fill="#173b40" font-family="system-ui, sans-serif" font-size="16" font-weight="normal" text-anchor="start">towards the lake</text><text x="458" y="61" fill="#173b40" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">A</text><text x="504" y="115" fill="#173b40" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">B</text><text x="28" y="216" fill="#114752" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Lake</text><text x="385" y="205" fill="#274b50" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Muddy water</text></svg>
