<svg width="624" height="210" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 624 210" role="img" aria-labelledby="labelstitle labelsdesc"><title id="labelstitle">Screening labels and independent evidence</title><desc id="labelsdesc">One comparison measures agreement with the image-derived screening rule. A separate comparison uses appropriately located and timed independent measurements to address what was present in the water.</desc><rect x="0" y="0" width="624" height="218" rx="8" fill="#f0f6f4" stroke="none" stroke-width="1.5"/><text x="20" y="29" fill="#173b40" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="start">Two comparisons answer different questions</text><rect x="18" y="47" width="280" height="145" rx="8" fill="#e2ebe7" stroke="#cadbd1" stroke-width="1.5"/><rect x="316" y="47" width="290" height="145" rx="8" fill="#e3edef" stroke="#cadfe1" stroke-width="1.5"/><text x="158" y="79" fill="#224b3e" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Map rule</text><text x="158" y="106" fill="#173b40" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">Marks on a picture</text><text x="158" y="136" fill="#507668" font-family="system-ui, sans-serif" font-size="23" font-weight="bold" text-anchor="middle">↓</text><text x="158" y="166" fill="#224b3e" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Does the model agree?</text><text x="461" y="79" fill="#254a57" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" text-anchor="middle">Lake check</text><text x="461" y="106" fill="#173b40" font-family="system-ui, sans-serif" font-size="15" font-weight="normal" text-anchor="middle">Water from the same spot</text><text x="461" y="136" fill="#557881" font-family="system-ui, sans-serif" font-size="23" font-weight="bold" text-anchor="middle">↓</text><text x="461" y="166" fill="#254a57" font-family="system-ui, sans-serif" font-size="16" font-weight="bold" text-anchor="middle">What was in the water?</text></svg>
