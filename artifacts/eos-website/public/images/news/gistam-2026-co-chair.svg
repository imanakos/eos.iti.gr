<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Ioannis Manakos, Conference Co-Chair of GISTAM 2026</title>
  <desc id="desc">GISTAM 2026 conference news graphic for Benidorm, Spain, 21 to 23 May 2026.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a33"/>
      <stop offset="0.58" stop-color="#123b63"/>
      <stop offset="1" stop-color="#087f8c"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#5ee7e7" stop-opacity=".42"/>
      <stop offset="1" stop-color="#5ee7e7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="#d8ffff" stroke-opacity=".1"/>
    </pattern>
    <clipPath id="globe">
      <circle cx="970" cy="320" r="215"/>
    </clipPath>
  </defs>

  <rect width="1200" height="675" fill="url(#background)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <circle cx="970" cy="320" r="320" fill="url(#glow)"/>

  <g clip-path="url(#globe)" fill="none" stroke="#b9ffff" stroke-opacity=".35">
    <circle cx="970" cy="320" r="212" stroke-width="3"/>
    <ellipse cx="970" cy="320" rx="118" ry="212" stroke-width="2"/>
    <ellipse cx="970" cy="320" rx="35" ry="212" stroke-width="2"/>
    <path d="M758 320h424M785 225h370M785 415h370" stroke-width="2"/>
    <path d="M810 165c96 63 224 63 320 0M810 475c96-63 224-63 320 0" stroke-width="2"/>
  </g>

  <g transform="translate(880 220)">
    <path d="M90 0c-55 0-100 45-100 100 0 76 100 178 100 178s100-102 100-178C190 45 145 0 90 0Z" fill="#f6bd45"/>
    <circle cx="90" cy="100" r="43" fill="#0a2847"/>
    <circle cx="90" cy="100" r="18" fill="#72e6e6"/>
  </g>

  <g font-family="Inter, Arial, sans-serif">
    <text x="76" y="92" fill="#8deff0" font-size="24" font-weight="700" letter-spacing="5">12TH INTERNATIONAL CONFERENCE</text>
    <text x="72" y="205" fill="#ffffff" font-size="92" font-weight="800" letter-spacing="-3">GISTAM</text>
    <text x="469" y="205" fill="#f6bd45" font-size="92" font-weight="800">2026</text>

    <rect x="76" y="252" width="420" height="52" rx="26" fill="#72e6e6"/>
    <text x="286" y="286" fill="#08223c" font-size="23" font-weight="800" text-anchor="middle" letter-spacing="2">CONFERENCE CO-CHAIR</text>

    <text x="76" y="390" fill="#ffffff" font-size="42" font-weight="750">Dr. Ioannis Manakos</text>
    <text x="76" y="438" fill="#cdebed" font-size="25">Centre for Research and Technology Hellas</text>

    <line x1="76" y1="490" x2="636" y2="490" stroke="#72e6e6" stroke-width="3"/>
    <text x="76" y="548" fill="#ffffff" font-size="28" font-weight="650">Benidorm, Spain</text>
    <text x="76" y="592" fill="#f6bd45" font-size="27" font-weight="700">21–23 May 2026</text>
    <text x="76" y="630" fill="#b9d9df" font-size="17" letter-spacing=".5">Geographical Information Systems Theory, Applications and Management</text>
  </g>
</svg>
